<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#293b4a">
<link rel="manifest" href="manifest.json">
<title>Mi Rutina</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef1f4;color:#18232d}
header{background:linear-gradient(135deg,#1f2d39,#344957);color:#fff;padding:15px;position:sticky;top:0;z-index:20}
.wrap{max-width:780px;margin:auto;padding:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.tabs button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;background:#e1e6ea;color:#293b4a}.tabs button.active,.btn.primary{background:#293b4a;color:#fff}
.card,.exercise{background:#fff;border:1px solid #d7dee4;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 3px 14px #18232d12}
.exercise{background:#f8f9fa;border-left:4px solid #506474}.hidden{display:none}.small{font-size:12px;color:#687682}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
input,select{width:100%;padding:9px;border:1px solid #cbd3da;border-radius:8px;font-size:16px;background:#fff}
.check{display:flex;gap:7px;align-items:center;font-weight:700}.check input{width:auto}
.exercise-head{display:flex;justify-content:space-between;gap:8px}.main{border-left-color:#293b4a}
.last{background:#e8edf0;border-radius:10px;padding:9px;margin:9px 0}.suggest{background:#eef2ff;border-radius:10px;padding:10px;margin:9px 0}
.sets{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;align-items:center;margin-top:8px}.setrow{display:contents}
.sets input{min-width:0}.done{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #d7dee4;border-radius:10px;background:#fff;margin:8px 0}
.done button{border:0;border-radius:9px;padding:8px 14px;background:#e1e6ea;font-weight:800}.done button.checked{background:#293b4a;color:#fff}
.timer{position:fixed;right:16px;bottom:16px;z-index:50;background:#293b4a;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 30px #0004;min-width:190px}
.timer strong{font-size:30px;font-variant-numeric:tabular-nums}.timer .small{color:#d7dee4}.timer button{border:0;border-radius:8px;padding:6px 9px;margin-left:4px}
.progress{height:9px;background:#dce2e7;border-radius:8px;overflow:hidden}.progress div{height:100%;background:#506474}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px;border:1px solid #d7dee4;border-radius:12px;background:#f8f9fa}
.history{padding:10px 0;border-bottom:1px solid #e5e7eb}.pill{display:inline-block;background:#e4e9ed;border-radius:999px;padding:3px 8px;font-size:11px;margin:2px}
canvas{width:100%;height:230px;border:1px solid #d7dee4;border-radius:10px;background:#fff}
@media(max-width:500px){.grid,.statgrid{grid-template-columns:1fr}.timer{right:10px;left:10px;bottom:10px}}
</style>
</head>
<body>
<header><div class="wrap"><h1 style="margin:0">🏋️ Mi Rutina</h1><div id="date" class="small" style="color:#d7dee4"></div></div></header>
<main class="wrap">
<nav class="tabs">
<button class="active" data-tab="train">Entrenar</button><button data-tab="stats">Estadísticas</button>
<button data-tab="history">Historial</button><button data-tab="data">Datos</button>
</nav>

<section id="train">
<div class="card">
<h2 style="margin-top:0">Entrenamiento</h2>
<div class="grid">
<label class="small">Programa<select id="program" onchange="changeProgram()">
<option value="current">Rutina actual</option><option value="strength">Ciclo 1 · Fuerza</option>
<option value="hypertrophy">Ciclo 2 · Hipertrofia</option><option value="power">Ciclo 3 · Potencia</option>
</select></label>
<label class="small">Sesión<select id="workout"></select></label>
</div>
<div class="grid" style="margin-top:8px">
<label class="small">Fecha<input type="date" id="sessionDate"></label>
<label class="small">Descanso<select id="defaultRest"><option value="180">3 min</option><option value="240">4 min</option><option value="300">5 min</option><option value="90">90 s</option><option value="120">120 s</option></select></label>
</div>
<div id="weekInfo" class="small" style="margin-top:8px"></div>
</div>
<div id="session"></div>
</section>

<section id="stats" class="hidden">
<div class="card">
<h2 style="margin-top:0">📈 Progresión</h2>
<div id="statCards" class="statgrid"></div>
<select id="statExercise" onchange="drawChart()" style="margin-top:10px"></select>
<canvas id="chart" width="760" height="260"></canvas>
</div>
</section>

<section id="history" class="hidden">
<div class="card"><h2 style="margin-top:0">Historial</h2><div id="historyList"></div></div>
</section>

<section id="data" class="hidden">
<div class="card">
<h2 style="margin-top:0">💾 Datos</h2>
<p class="small">Los datos siguen usando las claves de la app anterior para no perder el historial del navegador.</p>
<div class="actions">
<button class="btn primary" onclick="exportData()">⬇️ Exportar</button>
<button class="btn" onclick="document.getElementById('import').click()">⬆️ Importar</button>
<button class="btn" onclick="clearHistory()">🗑️ Borrar historial</button>
</div>
<input id="import" type="file" accept="application/json" hidden onchange="importData(event)">
</div>
</section>
</main>
<div id="timer" class="timer hidden"></div>

<script>
const KEY='miRutinaDataV1';
let data=loadData(), currentSession=null, restTimer=null, restLeft=0, restTotal=0;

const cycles={
strength:{
name:'Ciclo 1 · Fuerza',weeks:6,rest:180,
workouts:{
'Tirón A':[
 ['Dominadas lastradas','4 × 4-6','main','pullup'],
 ['Dominadas supinas lastradas','3 × 5-6','main','chinup'],
 ['Remo australiano','3 × 8-12','accessory'],
 ['Curl bíceps','3 × 8-12','accessory'],
 ['Face Pull','3 × 12-20','accessory'],
 ['Pierna','','simple'],['Abs','','simple']],
'Empuje A':[
 ['Pino / progresión','4 series','main','handstand'],
 ['Fondos lastrados','4 × 4-6','main','dip'],
 ['Pike push-up elevada','3 × 6-10','main','pike'],
 ['Tríceps','3 × 10-15','accessory'],
 ['Elevaciones laterales','3 × 12-20','accessory'],
 ['Pierna','','simple'],['Abs','','simple']],
'Tirón B':[
 ['Muscle-up técnico','4 × 1-3','main','muscleup'],
 ['Dominadas explosivas al pecho','4 × 3-5','main','explosive'],
 ['Dominadas pronas lastradas','3 × 4-6','main','pullup'],
 ['Curl bíceps','2-3 × 10-12','accessory'],
 ['Face Pull','2-3 × 12-20','accessory'],
 ['Pierna','','simple'],['Abs','','simple']],
'Empuje B':[
 ['Pino / progresión','4 series','main','handstand'],
 ['Fondos lastrados','3 × 5-6','main','dip'],
 ['Flexiones en paralelas','3 × 8-12','main','pushup'],
 ['Tríceps','3 × 10-15','accessory'],
 ['Elevaciones laterales','3 × 12-20','accessory'],
 ['Pierna','','simple'],['Abs','','simple']]
}},
hypertrophy:{
name:'Ciclo 2 · Hipertrofia',weeks:8,rest:105,
workouts:{
'Tirón A':[['Dominadas lastradas','4 × 6-10','main','pullup'],['Dominadas supinas','3 × 8-12','main','chinup'],['Remo australiano','3 × 10-15','accessory'],['Curl bíceps','3 × 10-15','accessory'],['Face Pull','3 × 15-20','accessory'],['Pierna','','simple'],['Abs','','simple']],
'Empuje A':[['Pino / progresión','3-4 series','main','handstand'],['Fondos lastrados','4 × 6-10','main','dip'],['Pike push-up elevada','3 × 8-12','main','pike'],['Tríceps','3 × 10-15','accessory'],['Elevaciones laterales','3 × 12-20','accessory'],['Pierna','','simple'],['Abs','','simple']],
'Tirón B':[['Dominadas pronas','3 × 8-12','main','pullup'],['Dominadas supinas','3 × 8-12','main','chinup'],['Muscle-up técnico','2-3 × 1-2','main','muscleup'],['Remo australiano','3 × 10-15','accessory'],['Curl bíceps','3 × 10-15','accessory'],['Face Pull','3 × 15-20','accessory'],['Pierna','','simple'],['Abs','','simple']],
'Empuje B':[['Pino / progresión','3 series','main','handstand'],['Fondos','3 × 8-12','main','dip'],['Flexiones en paralelas','3 × 10-15','main','pushup'],['Tríceps','3 × 10-15','accessory'],['Elevaciones laterales','3 × 15-20','accessory'],['Pierna','','simple'],['Abs','','simple']]
}},
power:{
name:'Ciclo 3 · Potencia',weeks:4,rest:180,
workouts:{
'Tirón A':[['Dominadas explosivas al pecho','5 × 3','main','explosive'],['Muscle-up','4 × 1-2','main','muscleup'],['Dominadas lastradas','3 × 3-4','main','pullup'],['Remo australiano explosivo','3 × 5-8','accessory'],['Face Pull','2-3 × 15-20','accessory'],['Pierna','','simple'],['Abs','','simple']],
'Empuje A':[['Pino / progresión','4 series','main','handstand'],['Fondos explosivos','4 × 3-5','main','dip'],['Flexiones explosivas','4 × 3-5','main','pushup'],['Pike push-up','3 × 5-8','main','pike'],['Elevaciones laterales','2-3 × 15-20','accessory'],['Pierna','','simple'],['Abs','','simple']],
'Tirón B':[['Muscle-up','5 × 1-2','main','muscleup'],['Dominadas explosivas','5 × 3','main','explosive'],['Dominadas lastradas','3 × 3','main','pullup'],['Remo australiano','3 × 8-10','accessory'],['Face Pull','2-3 × 15-20','accessory'],['Pierna','','simple'],['Abs','','simple']],
'Empuje B':[['Pino / progresión','4 series','main','handstand'],['Fondos explosivos','4 × 3-5','main','dip'],['Flexiones explosivas','3 × 4-6','main','pushup'],['Fondos normales','3 × 6-8','main','dip'],['Elevaciones laterales','2-3 × 15-20','accessory'],['Pierna','','simple'],['Abs','','simple']]
}},
current:{name:'Rutina actual',weeks:0,rest:120,workouts:{
'Tirón A':[['Dominadas pronas/neutras','4 × 5-8','main','pullup'],['Dominadas supinas','3 × 6-10','main','chinup'],['Remo australiano','2-3 × 10-15','accessory'],['Curl bíceps','2-3 × 10-15','accessory'],['Face Pull','2-3 × 12-20','accessory'],['Pierna','','simple'],['Abs','','simple']],
'Empuje A':[['Pino asistido','4 × 2-4','main','handstand'],['Fondos','4 × 5-8','main','dip'],['Pike Push Ups','3 × 6-10','main','pike'],['Flexiones en paralelas','3 × 8-15','accessory'],['Elevaciones laterales','3 × 12-20','accessory'],['Pierna','','simple'],['Abs','','simple']],
'Tirón B':[['Dominadas pronas/neutras','4 × 5-8','main','pullup'],['Dominadas supinas','3 × 6-10','main','chinup'],['Remo australiano','2-3 × 10-15','accessory'],['Curl bíceps','2-3 × 10-15','accessory'],['Face Pull','2-3 × 12-20','accessory'],['Pierna','','simple'],['Abs','','simple']],
'Empuje B':[['Pino asistido','4 × 2-4','main','handstand'],['Fondos','3 × 5-8','main','dip'],['Flexiones en paralelas','3 × 8-15','accessory'],['Tríceps','3 × 10-15','accessory'],['Elevaciones laterales','3 × 12-20','accessory'],['Pierna','','simple'],['Abs','','simple']]
}}};

let program='current', workout='Tirón A';

function loadData(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){let d=new Date();return d.toISOString().slice(0,10)}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})}

document.getElementById('date').textContent=fmt(today());
document.getElementById('sessionDate').value=today();

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
 document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');
 if(b.dataset.tab==='stats')renderStats(); if(b.dataset.tab==='history')renderHistory();
});

function init(){
 const sel=document.getElementById('workout');sel.innerHTML=Object.keys(cycles.current.workouts).map(x=>`<option>${x}</option>`).join('');
 sel.value=workout;sel.onchange=()=>{workout=sel.value;renderSession()};
 changeProgram();
}
function changeProgram(){
 program=document.getElementById('program').value;
 const c=cycles[program],sel=document.getElementById('workout');
 sel.innerHTML=Object.keys(c.workouts).map(x=>`<option>${x}</option>`).join('');
 workout=sel.value; document.getElementById('defaultRest').value=String(c.rest);
 document.getElementById('weekInfo').textContent=c.weeks?`Semana 1 de ${c.weeks} · Progresión automática de carga`:'Rutina actual';
 renderSession();
}

function prev(name){
 for(let i=data.length-1;i>=0;i--){
  const e=(data[i].exercises||[]).find(x=>x.name===name);
  if(e)return e;
 }
 return null;
}
function nums(e){return (e?.sets||[]).map(s=>({w:parseFloat(String(s.weight).replace(',','.')),r:parseInt(s.reps)})).filter(x=>Number.isFinite(x.r))}
function suggestion(name,code,target){
 const p=prev(name), n=nums(p); if(!p||!n.length)return '';
 const maxR=parseTargetMax(target);
 const allMax=maxR && n.length>=2 && n.every(x=>x.r>=maxR);
 let w=n.map(x=>x.w).filter(Number.isFinite); let last=w.length?Math.max(...w):0;
 if(!['pullup','dip','chinup'].includes(code))return '';
 if(allMax){
  const inc=code==='pullup'||code==='chinup'?2.5:2.5;
  return `<div class="suggest"><b>🚀 Sugerencia de hoy: +${(last+inc).toString().replace('.0','')} kg</b><br><span class="small">Has completado el máximo del rango anterior.</span><button class="btn primary" style="margin-top:7px" onclick="applySuggestion(${currentSession.exercises.findIndex(x=>x.name===name)},${last+inc})">Usar carga sugerida</button></div>`;
 }
 if(last)return `<div class="suggest"><b>↔ Mantener: +${last} kg</b><br><span class="small">La última sesión no completó todo el rango máximo.</span></div>`;
 return '';
}
function parseTargetMax(t){let m=String(t).match(/(\d+)\s*[–-]\s*(\d+)/);return m?parseInt(m[2]):null}
function applySuggestion(i,w){currentSession.exercises[i].sets.forEach(s=>s.weight=w);renderSession()}

function renderSession(){
 const c=cycles[program]; currentSession={date:document.getElementById('sessionDate').value||today(),program,workout,exercises:c.workouts[workout].map(x=>({name:x[0],target:x[1],type:x[2],code:x[3]||'',sets:[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}],done:false}))};
 const html=currentSession.exercises.map((e,i)=>{
  if(e.type==='simple')return `<div class="done"><b>${e.name==='Pierna'?'🦵':'▣'} ${e.name}</b><button id="simple${i}" onclick="toggleSimple(${i})">☐</button></div>`;
  if(e.type==='accessory')return `<div class="done"><div><b>${esc(e.name)}</b><div class="small">${esc(e.target)}</div></div><button id="simple${i}" onclick="toggleSimple(${i})">☐</button></div>`;
  const p=prev(e.name), pn=nums(p), prevText=p?pn.map(x=>(Number.isFinite(x.w)?'+'+x.w+' kg ':'')+(x.r||'')+' reps').join(' · '):'Sin registro anterior';
  return `<div class="exercise main">
   <div class="exercise-head"><div><h3 style="margin:0">${esc(e.name)}</h3><div class="small">${esc(e.target)}</div></div><span class="pill">PRINCIPAL</span></div>
   <div class="last"><b>Última sesión:</b> ${esc(prevText)}</div>
   ${suggestion(e.name,e.code,e.target)}
   <div class="sets"><span class="small">Serie</span><span class="small">KG</span><span class="small">REPS</span>
   ${e.sets.map((s,j)=>`<div class="setrow"><span>${j+1}</span><input type="number" step="0.5" placeholder="kg" value="${esc(s.weight)}" oninput="setVal(${i},${j},'weight',this.value)"><input type="number" placeholder="reps" value="${esc(s.reps)}" oninput="setVal(${i},${j},'reps',this.value)" onchange="maybeRest(${i},${j})"></div>`).join('')}</div>
   <button class="btn primary" style="margin-top:10px" onclick="completeExercise(${i})">✓ Guardar ejercicio</button>
  </div>`;
 }).join('');
 document.getElementById('session').innerHTML=html;
}
function setVal(i,j,k,v){currentSession.exercises[i].sets[j][k]=v}
function maybeRest(i,j){
 const s=currentSession.exercises[i].sets[j]; if(String(s.reps).trim()) startRest(parseInt(document.getElementById('defaultRest').value));
}
function toggleSimple(i){currentSession.exercises[i].done=!currentSession.exercises[i].done;document.getElementById('simple'+i).textContent=currentSession.exercises[i].done?'✓':'☐'}
function completeExercise(i){
 const e=currentSession.exercises[i]; e.done=true;
 const has=nums(e).length>0; if(has) startRest(parseInt(document.getElementById('defaultRest').value));
}
function startRest(seconds){
 clearInterval(restTimer);restLeft=seconds;restTotal=seconds;showTimer();
 restTimer=setInterval(()=>{restLeft--;showTimer();if(restLeft<=0){clearInterval(restTimer);restLeft=0;showTimer();if(navigator.vibrate)navigator.vibrate([250,120,250])}},1000)
}
function showTimer(){
 const el=document.getElementById('timer');el.classList.remove('hidden');
 const m=Math.floor(restLeft/60),s=restLeft%60;el.innerHTML=`<div class="small">⏱️ DESCANSO</div><strong>${m}:${String(s).padStart(2,'0')}</strong><div><button onclick="startRest(Math.max(1,restLeft+30))">+30s</button><button onclick="clearInterval(restTimer);el.classList.add('hidden')">Cerrar</button></div><div class="progress" style="margin-top:7px"><div style="width:${restTotal?restLeft/restTotal*100:0}%"></div></div>`;
}

function saveSession(){
 if(!currentSession)return;
 currentSession.id=Date.now();currentSession.routineName=cycles[program].name;
 data.push(JSON.parse(JSON.stringify(currentSession)));save();renderHistory();renderStats();
}
document.getElementById('sessionDate').addEventListener('change',renderSession);

function renderHistory(){
 const el=document.getElementById('historyList');
 if(!data.length){el.innerHTML='<p class="small">Todavía no hay sesiones.</p>';return}
 el.innerHTML=data.slice().reverse().map((s,idx)=>`<div class="history"><b>${esc(s.routineName||s.program||'Entrenamiento')}</b> · ${fmt(s.date)}<div class="small">${esc(s.workout||'')}</div>${(s.exercises||[]).filter(e=>e.done).map(e=>`<span class="pill">${esc(e.name)}</span>`).join('')}<br><button class="btn" style="margin-top:7px" onclick="deleteSession(${data.length-1-idx})">✕ Borrar</button></div>`).join('');
}
function deleteSession(i){if(confirm('¿Borrar esta sesión?')){data.splice(i,1);save();renderHistory();renderStats()}}
function renderStats(){
 const main=['Dominadas lastradas','Fondos lastrados','Dominadas pronas lastradas','Dominadas supinas lastradas','Muscle-up técnico','Muscle-up','Dominadas explosivas al pecho','Dominadas explosivas'];
 const found=main.filter(n=>data.some(s=>(s.exercises||[]).some(e=>e.name===n)));
 document.getElementById('statCards').innerHTML=(found.length?found:main.slice(0,5)).map(n=>{
  const rows=[];data.forEach(s=>{const e=(s.exercises||[]).find(x=>x.name===n);if(e){const ns=nums(e);if(ns.length)rows.push({d:s.date,w:Math.max(...ns.map(x=>Number.isFinite(x.w)?x.w:0)),r:Math.max(...ns.map(x=>x.r))})}});
  const last=rows[rows.length-1];return `<div class="stat"><b>${esc(n)}</b><div style="font-size:22px;margin-top:5px">${last?(last.w?'+'+last.w+' kg':'')+' '+last.r+' reps':'—'}</div><div class="small">${last?'Última sesión '+fmt(last.d):'Sin datos'}</div></div>`
 }).join('');
 const sel=document.getElementById('statExercise');sel.innerHTML=(found.length?found:main).map(n=>`<option>${esc(n)}</option>`).join('');drawChart();
}
function drawChart(){
 const name=document.getElementById('statExercise').value,can=document.getElementById('chart'),ctx=can.getContext('2d');ctx.clearRect(0,0,can.width,can.height);
 const rows=[];data.forEach(s=>{const e=(s.exercises||[]).find(x=>x.name===name);if(e){const ns=nums(e);if(ns.length)rows.push({d:s.date,v:Math.max(...ns.map(x=>Number.isFinite(x.w)?x.w:x.r))})}});
 if(!rows.length){ctx.fillStyle='#687682';ctx.font='16px system-ui';ctx.fillText('Aún no hay suficientes datos para este ejercicio.',20,35);return}
 const max=Math.max(...rows.map(x=>x.v)),min=Math.min(...rows.map(x=>x.v)),pad=35,w=can.width-pad*2,h=can.height-pad*2;
 ctx.strokeStyle='#d7dee4';ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,pad+h);ctx.lineTo(pad+w,pad+h);ctx.stroke();
 ctx.strokeStyle='#293b4a';ctx.lineWidth=3;ctx.beginPath();rows.forEach((p,i)=>{let x=pad+(rows.length===1?w/2:i*w/(rows.length-1)),y=pad+h-(max===min?h/2:(p.v-min)/(max-min))*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
 ctx.fillStyle='#293b4a';rows.forEach((p,i)=>{let x=pad+(rows.length===1?w/2:i*w/(rows.length-1)),y=pad+h-(max===min?h/2:(p.v-min)/(max-min))*h;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();});
}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mi-rutina-copia.json';a.click();URL.revokeObjectURL(a.href)}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(Array.isArray(x)){data=x;save();renderHistory();renderStats();alert('Datos importados.')}}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
function clearHistory(){if(confirm('¿Borrar todo el historial?')){data=[];save();renderHistory();renderStats()}}
init();
</script>
</body>
</html>
